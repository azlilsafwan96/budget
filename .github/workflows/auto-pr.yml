name: Auto PR

# Opens a PR for any branch you push and turns on auto-merge, so a branch that
# passes CI lands on main without further clicks. Branch protection still does
# the gating — auto-merge only fires once the required checks are green.
#
# Uses AUTOMERGE_TOKEN (a fine-grained PAT) rather than GITHUB_TOKEN, because a
# push made with GITHUB_TOKEN does not trigger workflows: merging with it left
# main with no CI run and no published image. Falls back to GITHUB_TOKEN so the
# workflow still functions if the secret is missing — merges just stop
# triggering main workflows again.
on:
  push:
    branches-ignore: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  open-and-automerge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Open a PR if one is not already open
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN || secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          # `gh pr view` matches closed and merged PRs too, so it cannot answer
          # "is one open right now?" — reusing a branch name would make it skip
          # creation and then fail with nothing to merge. Ask for open PRs only.
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')" ]; then
            echo "PR already open for $BRANCH"
          else
            # Title comes from the branch's first commit subject; body links back
            # to the full log rather than duplicating it.
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "$(git log -1 --pretty=%s)" \
              --body "Opened automatically from a push to \`$BRANCH\`."
          fi

      # Queues the merge. GitHub holds it until the required checks pass, then
      # merges; if a check fails, the PR just stays open.
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN || secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          # Re-running this job after the PR has already merged is not a
          # failure — there is simply nothing left to queue.
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')" ]; then
            echo "No open PR for $BRANCH; nothing to auto-merge."
            exit 0
          fi
          gh pr merge "$BRANCH" --auto --squash --delete-branch
