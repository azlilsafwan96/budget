name: Release

# Publishes a container image for every commit that reaches main. Deploying is
# a separate, manual step — this workflow only makes an artifact available.
on:
  push:
    branches: [main]

# Never cancel a publish half-way; a partially pushed tag is worse than a
# slightly stale queue.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Two tags per build: the short commit SHA, which is what you deploy and
      # roll back to, and `latest` as a convenience for "whatever is newest".
      # Never deploy `latest` deliberately — it tells you nothing about what is
      # actually running.
      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=short,prefix=
            type=raw,value=latest

      # linux/amd64 only, matching the x86-64 mini PC. An ARM host would need
      # `platforms: linux/amd64,linux/arm64` and QEMU, at roughly double the
      # build time.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarise
        run: |
          {
            echo "### Image published"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "Deploy this build by passing the SHA tag to the deploy workflow."
          } >> "$GITHUB_STEP_SUMMARY"
